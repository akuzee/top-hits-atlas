# Publishes the app to GitHub Pages on every push to main: the page, styles,
# scripts and built data, after the same checks a contributor runs locally.
# The pipeline under tools/ and its source tables aren't served.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check
        run: |
          for f in js/*.js; do node --check "$f"; done
          node tools/test-model.mjs
          node tools/test-tv.mjs
          node tools/test-quiz.mjs
      - name: Stage the site
        run: mkdir _site && cp -r index.html css js data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
