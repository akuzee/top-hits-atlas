<title>Hit Atlas</title>
<meta name="description" content="The hits of every year since the late 1950s, songs, films and TV, mapped by year, genre and career.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Big+Shoulders+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="css/styles.css">

<div class="app">
  <header class="mast">
    <div class="mast-row">
      <a class="wordmark" href="#about" aria-label="Hit Atlas: about">
        <span class="wm-big">Hit Atlas</span>
      </a>
      <div class="domains" id="domains" role="group" aria-label="Medium" hidden></div>
      <span class="wm-sub" id="wm-sub"></span>
      <nav class="tabs" id="tabs" aria-label="Views"></nav>
      <div class="search">
        <input id="search" type="search" placeholder="Find a song or artist" autocomplete="off" spellcheck="false" aria-label="Search">
        <div class="search-results" id="search-results" hidden></div>
      </div>
    </div>
    <div class="legend" id="legend" role="group" aria-label="Genres: tap one to spotlight it"></div>
  </header>

  <main id="main">
    <section class="view" id="view-wall" hidden></section>
    <section class="view" id="view-no1s" hidden></section>
    <section class="view" id="view-genres" hidden></section>
    <section class="view" id="view-lanes" hidden></section>
    <section class="view" id="view-quiz" hidden></section>
    <section class="view" id="view-about" hidden></section>
    <p class="loading" id="loading">Loading the charts…</p>
  </main>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Details">
  <button class="drawer-close" id="drawer-close" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>
<div class="tip" id="tip" hidden></div>

<script src="js/core.js"></script>
<script src="js/model.js"></script>
<script src="js/music.js"></script>
<script src="js/wall.js"></script>
<script src="js/calendar.js"></script>
<script src="js/river.js"></script>
<script src="js/lanes.js"></script>
<script src="js/quiz.js"></script>
<script src="js/about.js"></script>
<script src="js/app.js"></script>
